name: DailyAlPriceCrawl
on:
  schedule:
    cron: "20 2 * 1-12 1-5"
  workflow_dispatch:

jobs:
  crawl-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run crawl script
        run: node scrape-log.js

      - name: Commit log files
        uses: EndBug/add-and-commit@v10
        with:
          author_name: AutoCrawlBot
          author_email: bot@example.com
          message: Update daily price log
          add: |
            price_log.txt
            daily_price.json
