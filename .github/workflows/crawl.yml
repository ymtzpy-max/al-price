name: DailyAlPriceCrawl
on:
  schedule:
    cron: "20 2 * 1-12 1-5"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install akshare
        run: |
          pip install --upgrade akshare pandas

      - name: Run crawl script
        run: python crawl_al_rate.py

      - name: Commit logs
        uses: EndBug/add-and-commit@v10
        with:
          author_name: AutoPriceBot
          author_email: bot@example.com
          message: Auto update daily price log
          add: |
            price_log.txt
            daily_price.json
