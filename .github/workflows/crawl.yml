name: 沪铝每日10:15基准期现货定点采集
on:
  schedule:
    # cron格式：分 时 日 月 周；UTC 02:00-02:30 每2分钟执行，仅工作日
    - cron: '*/2 2 * * 1-5'
  # 支持手动一键触发测试
  workflow_dispatch:

jobs:
  run_crawl_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行采集脚本
        run: python crawl_al_rate.py

      - name: 自动提交更新后的CSV数据
        run: |
          git config --global user.name "AlDataAutoBot"
          git config --global user.email "al-crawl@example.com"
          git add al_daily_basis.csv
          # 无新数据时跳过commit，避免空提交报错
          git diff --quiet && git diff --staged --quiet || git commit -m "自动归档当日10:15基准期现货数据"
          git push
