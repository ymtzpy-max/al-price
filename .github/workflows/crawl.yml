name: Aluminum Price & FX Timed Crawl
on:
  schedule:
    # UTC 02:00~02:30 每2分钟执行，周一至周五
    - cron: "*/2 2 * * 1-5"
  workflow_dispatch:

jobs:
  crawl_task:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependent packages
        run: |
          python -m pip install --upgrade pip
          pip install tushare requests

      - name: Execute crawl script
        run: python crawl_al_rate.py

      - name: Commit updated data files
        run: |
          git config --global user.name "AlCrawlAutoBot"
          git config --global user.email "crawl_bot@noreply.altrade.com"
          git add daily_price.json price_log.txt
          git diff --quiet && git diff --staged --quiet || (
              git commit -m "Auto sync price+fx data @ $(date '+%Y-%m-%d %H:%M CST')"
              git push
          )
