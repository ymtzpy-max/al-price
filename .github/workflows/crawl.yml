name: Aluminum Price & FX Auto Crawl
on:
  schedule:
    # UTC 02:00~02:30 = 北京时间10:00~10:30，周一至周五每2分钟运行
    - cron: "*/2 2 * * 1-5"
  workflow_dispatch:

jobs:
  crawl_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 执行采集脚本
        run: python crawl_al_rate.py

      - name: 自动提交更新文件
        run: |
          git config --global user.name "AlAutoCrawlBot"
          git config --global user.email "crawl_bot@noreply.altrade.com"
          git add daily_price.json price_log.txt
          git diff --quiet && git diff --staged --quiet || (
              git commit -m "Auto save price&fx data $(date '+%Y-%m-%d %H:%M CST')"
              git push
          )
